stages:
  - build

variables:
  VERSION: 1.0.${CI_PIPELINE_ID}

build-backend-docker:
  stage: build
  script:
    - echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
    - cd src/backend
    - docker build --target runtime -t ${CI_REGISTRY_IMAGE}/sandbox-backend:${VERSION} -t ${CI_REGISTRY_IMAGE}/sandbox-backend:latest .
    - docker push ${CI_REGISTRY_IMAGE}/sandbox-backend:${VERSION}
    - docker push ${CI_REGISTRY_IMAGE}/sandbox-backend:latest