image:
  tag: latest
  backend: ghcr.io/lookphor/sandbox-backend
  frontend: ghcr.io/lookphor/sandbox-frontend

ports:
  backend: 8081
  frontend: 8888
  nodePort: 30080

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }

postgres:
  enabled: true
  image: postgres:15-alpine
  user: sandbox
  password: sandbox
  database: sandbox
  storage: 1Gi
