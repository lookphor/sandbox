name: ci

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      VERSION:
        description: "VERSION для повторного деплоя/отката (пусто = сгенерировать)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Compute VERSION
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.VERSION }}
        shell: bash
        run: |
          V="${REQUESTED_VERSION:-$(date -u +%Y%m%d-%H%M%S)}"
          if ! [[ "$V" =~ ^[0-9]{8}-[0-9]{6}$ ]]; then
            echo 'Expected VERSION in YYYYMMDD-HHMMSS format.' >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION=$V"

  test:
    if: github.event_name != 'workflow_dispatch' || inputs.VERSION == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run tests
        working-directory: src/backend
        run: go test -count=1 ./...

  build:
    runs-on: ubuntu-latest
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Allow Docker to access HTTP Nexus
        env:
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
        shell: bash
        run: |
          config=$(mktemp)
          if sudo test -f /etc/docker/daemon.json; then
            sudo cat /etc/docker/daemon.json
          else
            printf '{}\n'
          fi | jq --arg host "$NEXUS_HOST" \
            '."insecure-registries" |= ((. // []) + [$host] | unique)' > "$config"
          sudo install -D -m 644 "$config" /etc/docker/daemon.json
          sudo systemctl restart docker

      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."${{ secrets.NEXUS_HOST }}"]
              http = true

      - name: Login ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Nexus
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_HOST }}
          username: ${{ secrets.NEXUS_REPO_USER }}
          password: ${{ secrets.NEXUS_REPO_PASS }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/sandbox-${{ matrix.component }}
            ${{ secrets.NEXUS_HOST }}/stepanov-${{ matrix.component }}-docker/sandbox-${{ matrix.component }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./src/${{ matrix.component }}
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    runs-on: ubuntu-latest
    needs: [version, build]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.version.result == 'success' &&
      (needs.build.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.VERSION != '' && needs.build.result == 'skipped'))
    environment: production
    steps:
      - uses: actions/checkout@v4


      - name: Copy files and deploy
        env:
          VERSION: ${{ needs.version.outputs.version }}
          APP_ENV_FILE: ${{ vars.APP_ENV_FILE }}
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
          NEXUS_USER: ${{ secrets.NEXUS_REPO_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_REPO_PASS }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          printf '%s\n' "$APP_ENV_FILE" > .env
          printf 'NEXUS_REGISTRY=%s\nIMAGE_REGISTRY=%s\nREGISTRY_USER=%s\nIMAGE_TAG=%s\nVERSION=%s\n' \
            "$NEXUS_HOST" "$NEXUS_HOST" "$NEXUS_USER" "$VERSION" "$VERSION" >> .env

          target="$VM_USER@$VM_HOST"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" 'umask 077; mkdir -p ~/sandbox'
          scp -B -o StrictHostKeyChecking=yes docker-compose.yaml .env deploy.sh "$target:sandbox/"
          printf '%s\n' "$NEXUS_PASSWORD" |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" 'cd ~/sandbox && chmod 600 .env && sh deploy.sh'
